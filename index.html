<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlyFans – Dołącz do twórców</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d0f;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #fff;
        }

        /* Navbar jak OnlyFans */
        .navbar {
            background: #0a0a0c;
            border-bottom: 1px solid #1f1f23;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #0088ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .nav-buttons {
            display: flex;
            gap: 16px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid #2a2a2e;
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn.primary {
            background: #0088ff;
            border: none;
        }

        /* Główny kontener */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }

        /* Formularz */
        .form-section {
            flex: 1.2;
            min-width: 300px;
        }

        .card {
            background: #1a1a1e;
            border-radius: 24px;
            padding: 32px;
            border: 1px solid #2a2a2e;
        }

        .card h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .card .sub {
            color: #888;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #aaa;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 14px 16px;
            background: #0d0d0f;
            border: 1px solid #2a2a2e;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: all 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #0088ff;
            box-shadow: 0 0 0 3px rgba(0,136,255,0.2);
        }

        /* Upload */
        .upload-box {
            background: #0d0d0f;
            border: 2px dashed #2a2a2e;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-box:hover {
            border-color: #0088ff;
            background: #111115;
        }

        .btn-submit {
            width: 100%;
            background: #0088ff;
            border: none;
            padding: 14px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 16px;
            transition: transform 0.1s;
        }

        .btn-submit:hover {
            background: #0077e6;
            transform: scale(1.01);
        }

        /* Podgląd profilu */
        .preview-section {
            flex: 0.9;
            min-width: 320px;
        }

        .profile-preview {
            background: #1a1a1e;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid #2a2a2e;
            position: sticky;
            top: 100px;
        }

        .preview-header {
            padding: 16px 20px;
            background: #0d0d0f;
            border-bottom: 1px solid #2a2a2e;
            font-weight: 600;
            font-size: 14px;
            color: #aaa;
        }

        .profile-content {
            padding: 0 0 24px 0;
        }

        .banner-area {
            height: 140px;
            background: #0d0d0f;
            overflow: hidden;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-area {
            padding: 0 20px;
            margin-top: -50px;
        }

        .avatar-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 4px solid #1a1a1e;
            object-fit: cover;
            background: #0d0d0f;
        }

        .info-area {
            padding: 16px 20px 0;
        }

        .preview-name {
            font-size: 20px;
            font-weight: 700;
        }

        .preview-username {
            color: #0088ff;
            font-size: 14px;
            margin-top: 4px;
        }

        .preview-bio {
            color: #aaa;
            font-size: 14px;
            margin-top: 12px;
            line-height: 1.5;
        }

        .status {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 800px) {
            .container { flex-direction: column; }
            .navbar { padding: 12px 20px; }
        }
    </style>
</head>
<body>

<!-- Navbar OnlyFans -->
<div class="navbar">
    <div class="logo">OnlyFans</div>
    <div class="nav-buttons">
        <button class="nav-btn">Zaloguj</button>
        <button class="nav-btn primary">Dołącz</button>
    </div>
</div>

<div class="container">
    <!-- LEWA STRONA – FORMULARZ -->
    <div class="form-section">
        <div class="card">
            <h2>Zostań twórcą 🔥</h2>
            <div class="sub">Dołącz do najlepszej platformy dla kreatywnych</div>

            <form id="creatorForm">
                <div class="form-group">
                    <label>Imię i nazwisko</label>
                    <input type="text" id="fullName" placeholder="Jan Kowalski" required>
                </div>

                <div class="form-group">
                    <label>@nazwa użytkownika</label>
                    <input type="text" id="username" placeholder="@jan_kowalski" required>
                </div>

                <div class="form-group">
                    <label>Nazwa wyświetlana</label>
                    <input type="text" id="displayName" placeholder="Janek Official" required>
                </div>

                <div class="form-group">
                    <label>Bio / Opis</label>
                    <textarea id="bio" rows="3" placeholder="Opowiedz swoim fanom coś o sobie..."></textarea>
                </div>

                <div class="form-group">
                    <label>Zdjęcie profilowe</label>
                    <div class="upload-box" id="avatarBox">
                        <input type="file" id="avatarInput" accept="image/*" hidden>
                        <span>📸 Kliknij, aby dodać avatar</span><br>
                        <small style="color:#666;">PNG, JPG – kwadratowe</small>
                    </div>
                </div>

                <div class="form-group">
                    <label>Baner (nagłówek)</label>
                    <div class="upload-box" id="bannerBox">
                        <input type="file" id="bannerInput" accept="image/*" hidden>
                        <span>🎨 Kliknij, aby dodać baner</span><br>
                        <small style="color:#666;">Szeroki obraz (np. 1200x400)</small>
                    </div>
                </div>

                <button type="submit" class="btn-submit">✨ Opublikuj profil ✨</button>
                <div id="status" class="status"></div>
            </form>
        </div>
    </div>

    <!-- PRAWA STRONA – PODGLĄD PROFILU -->
    <div class="preview-section">
        <div class="profile-preview">
            <div class="preview-header">PODGLĄD PROFILU</div>
            <div class="profile-content">
                <div class="banner-area">
                    <img id="previewBanner" class="banner-img" src="https://placehold.co/1200x400/111115/333?text=Twój+baner">
                </div>
                <div class="avatar-area">
                    <img id="previewAvatar" class="avatar-img" src="https://placehold.co/200/111115/333?text=Avatar">
                </div>
                <div class="info-area">
                    <div class="preview-name" id="previewName">Twoja nazwa</div>
                    <div class="preview-username" id="previewUsername">@uzytkownik</div>
                    <div class="preview-bio" id="previewBio">Twój opis pojawi się tutaj</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Elementy formularza
    const fullName = document.getElementById('fullName');
    const username = document.getElementById('username');
    const displayName = document.getElementById('displayName');
    const bio = document.getElementById('bio');

    // Elementy podglądu
    const previewName = document.getElementById('previewName');
    const previewUsername = document.getElementById('previewUsername');
    const previewBio = document.getElementById('previewBio');
    const previewAvatar = document.getElementById('previewAvatar');
    const previewBanner = document.getElementById('previewBanner');

    // Aktualizacja tekstu na żywo
    function updateText() {
        previewName.innerText = displayName.value || "Twoja nazwa";
        previewUsername.innerText = username.value || "@uzytkownik";
        previewBio.innerText = bio.value || "Twój opis pojawi się tutaj";
    }

    fullName.addEventListener('input', updateText);
    username.addEventListener('input', updateText);
    displayName.addEventListener('input', updateText);
    bio.addEventListener('input', updateText);

    // Upload avatara
    const avatarBox = document.getElementById('avatarBox');
    const avatarInput = document.getElementById('avatarInput');
    avatarBox.addEventListener('click', () => avatarInput.click());
    avatarInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (ev) => { previewAvatar.src = ev.target.result; };
            reader.readAsDataURL(file);
        }
    });

    // Upload banera
    const bannerBox = document.getElementById('bannerBox');
    const bannerInput = document.getElementById('bannerInput');
    bannerBox.addEventListener('click', () => bannerInput.click());
    bannerInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (ev) => { previewBanner.src = ev.target.result; };
            reader.readAsDataURL(file);
        }
    });

    // Obsługa submit (tylko informacja – bez webhooka)
    document.getElementById('creatorForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = '<span style="color:#0088ff;">✅ Profil gotowy! (webhook w następnym planie)</span>';
        setTimeout(() => {
            statusDiv.innerHTML = '';
        }, 3000);
    });
</script>
</body>
</html>
