<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FanClub - Utwórz profil</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial;background:#0a0a0a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}
        .form-card{background:#111;padding:40px;border-radius:20px;max-width:500px;width:100%}
        input,textarea{width:100%;padding:12px;margin:10px 0;background:#222;border:1px solid #333;color:#fff;border-radius:8px}
        button{background:#ff2e63;width:100%;padding:14px;border:none;border-radius:40px;color:#fff;font-weight:bold;cursor:pointer}
        .preview-img{width:100px;height:100px;border-radius:50%;object-fit:cover;margin:10px auto;display:block}
    </style>
</head>
<body>
    <div class="form-card">
        <h2>🔞 Utwórz profil</h2>
        <form action="create.php" method="POST" enctype="multipart/form-data">
            <input type="text" name="first_name" placeholder="Imię" required>
            <input type="text" name="last_name" placeholder="Nazwisko" required>
            <input type="file" name="avatar" accept="image/*" required>
            <input type="file" name="banner" accept="image/*" required>
            <input type="text" name="display_name" placeholder="Nazwa wyświetlana" required>
            <textarea name="bio" placeholder="Opis"></textarea>
            <input type="text" name="username" placeholder="@nazwa" required>
            <button type="submit">✨ Utwórz profil</button>
        </form>
    </div>
</body>
</html>
